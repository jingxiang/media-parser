
services:
  web:
    build: .
    container_name: media-parser-backend
    restart: always
    ports:
      - "8051:8051"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8051/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      # 将宿主机上的日志映射，便于容器重建后保留日志和排查问题
      - ./logs:/app/logs
      # 持久化用户、API Key、开关和调用日志
      - ./data:/app/data
    # 基础运行环境（开箱即用，无需配置 Cookie 即可直接启动）
    environment:
      - TZ=Asia/Shanghai
      - SECRET_KEY=${SECRET_KEY:-}
      - DATABASE_PATH=/app/data/media_parser.db
      - TRUST_PROXY_HEADERS=${TRUST_PROXY_HEADERS:-false}
      # 纯 API / 微服务模式（开启后不挂载 Web UI，全接口免 API Key 直接调用且不写请求日志）
      - API_ONLY=${API_ONLY:-false}
      # Cookie 触发的动态代理提取地址
      - JULIANG_PROXY_API_URL=${JULIANG_PROXY_API_URL:-}
      # 可选平台凭据（若在本地 .env 中配置将自动透传进容器）：
      - XHS_COOKIE=${XHS_COOKIE:-}
      - DOUYIN_COOKIE=${DOUYIN_COOKIE:-}
      - DOUBAO_COOKIE=${DOUBAO_COOKIE:-}
      - YUANBAO_COOKIE=${YUANBAO_COOKIE:-}
      - PINDUODUO_COOKIE=${PINDUODUO_COOKIE:-}
      - KUAISHOU_COOKIE=${KUAISHOU_COOKIE:-}
      - JIMENG_COOKIE=${JIMENG_COOKIE:-}
      - WEIBO_COOKIE=${WEIBO_COOKIE:-}
